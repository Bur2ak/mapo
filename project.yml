# Xcode projesi bu dosyadan üretilir: `xcodegen generate`
# Mapo.xcodeproj git'e girmez; tek kaynak bu dosya.
name: Mapo
options:
  bundleIdPrefix: io.github.bur2ak
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: tr
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Gömülü Python ve mapo-mcp arm64: uygulama da yalnız Apple Silicon (PLAN A23, A29).
    ARCHS: arm64
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    # Geliştirmede sabit kimlik (Apple Development): Anahtar Zinciri izni
    # derlemeler arasında korunur. Dağıtımda Developer ID (PLAN §3.7, Faz 5).
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: BJRH6882TU
    # Motor kopyalama betiği proje dışı bir klasörden okuyor.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  MapoCore:
    path: Packages/MapoCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Mapo:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/Map/**
      # Harita derlemesi (Map/ → npm run build) klasör olarak paketlenir.
      - path: App/Resources/Map
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: mapo-mcp'yi göm
        basedOnDependencyAnalysis: false
        script: |
          # MCP sunucusu (ajanlar için) uygulamanın yanında: Contents/MacOS/mapo-mcp
          set -e
          CONF=$([ "$CONFIGURATION" = "Release" ] && echo release || echo debug)
          cd "${SRCROOT}/Packages/MapoCore"
          env -i PATH="/usr/bin:/bin:/usr/sbin:/sbin" HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" \
            xcrun swift build -c "$CONF" --product mapo-mcp --arch arm64 --scratch-path "${OBJROOT}/mapo-mcp" >/dev/null
          cp "${OBJROOT}/mapo-mcp/arm64-apple-macosx/${CONF}/mapo-mcp" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/mapo-mcp"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime ${OTHER_CODE_SIGN_FLAGS:-} "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/mapo-mcp"
          fi
      - name: Örnek projeyi göm
        basedOnDependencyAnalysis: false
        script: |
          # İlk açılıştaki örnek harita: küçük bir full-stack uygulama
          # (mobil → Hono API → D1), köprüler ilk bakışta görünsün diye.
          set -e
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Sample"
          rm -rf "${DST}"
          mkdir -p "${DST}"
          rsync -a "${SRCROOT}/Sample/CoffeeShop" "${DST}/"
      - name: Gömülü motoru kopyala
        basedOnDependencyAnalysis: false
        script: |
          # scripts/build-engine.sh çıktısı varsa uygulamaya gömülür (PLAN §3.7).
          SRC="${SRCROOT}/Engine/dist"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Engine"
          if [ -x "${SRC}/bin/graphify" ]; then
            mkdir -p "${DST}"
            rsync -a --delete "${SRC}/" "${DST}/"
            echo "Motor gömüldü: $(du -sh "${DST}" | cut -f1)"
          else
            rm -rf "${DST}"
            echo "warning: Gömülü motor yok (bash scripts/build-engine.sh). Sistem graphify'ı kullanılacak."
          fi
    dependencies:
      - package: MapoCore
      - package: Sparkle
    settings:
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_ENTITLEMENTS: App/Mapo.entitlements
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bur2ak.mapo
        PRODUCT_NAME: Mapo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Mapo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Burak Gemicioğlu"
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Mapo:
    build:
      targets:
        Mapo: all
    run:
      config: Debug
    test:
      config: Debug
