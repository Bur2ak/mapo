# Xcode projesi bu dosyadan üretilir: `xcodegen generate`
# Atlas.xcodeproj git'e girmez; tek kaynak bu dosya.
name: Atlas
options:
  bundleIdPrefix: io.github.bur2ak
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: tr
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    # Geliştirmede sabit kimlik (Apple Development): Anahtar Zinciri izni
    # derlemeler arasında korunur. Dağıtımda Developer ID (PLAN §3.7, Faz 5).
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: BJRH6882TU
    # Motor kopyalama betiği proje dışı bir klasörden okuyor.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  AtlasCore:
    path: Packages/AtlasCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Atlas:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/Map/**
      # Harita derlemesi (Map/ → npm run build) klasör olarak paketlenir.
      - path: App/Resources/Map
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Gömülü motoru kopyala
        basedOnDependencyAnalysis: false
        script: |
          # scripts/build-engine.sh çıktısı varsa uygulamaya gömülür (PLAN §3.7).
          SRC="${SRCROOT}/Engine/dist"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Engine"
          if [ -x "${SRC}/bin/graphify" ]; then
            mkdir -p "${DST}"
            rsync -a --delete "${SRC}/" "${DST}/"
            echo "Motor gömüldü: $(du -sh "${DST}" | cut -f1)"
          else
            rm -rf "${DST}"
            echo "warning: Gömülü motor yok (bash scripts/build-engine.sh). Sistem graphify'ı kullanılacak."
          fi
    dependencies:
      - package: AtlasCore
      - package: Sparkle
    settings:
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_ENTITLEMENTS: App/Atlas.entitlements
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bur2ak.atlas
        PRODUCT_NAME: Atlas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Atlas
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Burak Gemicioğlu"
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Atlas:
    build:
      targets:
        Atlas: all
    run:
      config: Debug
    test:
      config: Debug
